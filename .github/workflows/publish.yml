name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Quality gates (fail fast before packaging) ────────────────
      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Compile (production)
        run: npm run compile

      # ── Version consistency check ─────────────────────────────────
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version (v${TAG_VERSION}) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi
          echo "✓ Tag v${TAG_VERSION} matches package.json ${PKG_VERSION}"

      # ── CHANGELOG version check ──────────────────────────────────
      - name: Verify CHANGELOG has entry for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if ! grep -q "## \[${PKG_VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for version ${PKG_VERSION}"
            exit 1
          fi
          echo "✓ CHANGELOG.md has entry for [${PKG_VERSION}]"

      # ── Package + Release ─────────────────────────────────────────
      - name: Package VSIX
        run: npx vsce package

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Generate SHA256
        run: |
          sha256sum codecomfy-vscode-${{ steps.version.outputs.version }}.vsix > SHA256SUMS.txt

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            codecomfy-vscode-${{ steps.version.outputs.version }}.vsix
            SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Marketplace publish (manual only until ADO PAT is fixed) ────
  publish_marketplace:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        run: npx vsce package

      - name: Publish to VS Code Marketplace
        run: |
          set -e
          echo "VSCE_PAT length: ${#VSCE_PAT}"
          npx --yes vsce verify-pat mcp-tool-shop -p "$VSCE_PAT"
          npx --yes vsce publish -p "$VSCE_PAT" || {
            echo ""
            echo "Marketplace publish failed (likely 401)."
            echo "If verify-pat passes but publish fails, this is often due to Azure DevOps PAT org-scope quirks."
            echo "Local workaround: npx vsce publish"
            exit 1
          }
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # `npm ci` is a silent install — audit warnings here would be noise
      # because we run a dedicated, loud `dep-audit` job below. This split
      # keeps install failures distinct from vulnerability failures.
      - name: Install dependencies
        run: npm ci --audit=false

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Compile (production)
        run: npm run compile

  dep-audit:
    # Dedicated job that fails the build on real HIGH/CRITICAL CVEs.
    # MODERATE and below are handled by Dependabot so they don't block PRs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Audit production dependencies (fail on HIGH+)
        run: npm audit --omit=dev --audit-level=high

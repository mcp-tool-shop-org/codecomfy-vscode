name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.github/workflows/**'
      - 'atlas/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.github/workflows/**'
      - 'atlas/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Atlas requires Node 22 or later, and this job tests on Node 20, so the
      # check gets its own Node 22 first; the setup-node step after it puts 20
      # back in front for everything the job tests.
      - name: Set up Node for the Atlas check
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # `npm ci` is a silent install — audit warnings here would be noise
      # because we run a dedicated, loud `dep-audit` job below. This split
      # keeps install failures distinct from vulnerability failures.
      - name: Install dependencies
        run: npm ci --audit=false

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Compile (production)
        run: npm run compile

  dep-audit:
    # Dedicated job that fails the build on real HIGH/CRITICAL CVEs.
    # MODERATE and below are handled by Dependabot so they don't block PRs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Audit production dependencies (fail on HIGH+)
        run: npm audit --omit=dev --audit-level=high
